name: Portable client and runtime checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt numpy ruff
      - run: python -m ruff check .
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_guide_language.mjs tests/test_output_status.mjs
